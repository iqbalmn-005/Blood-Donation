{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Line - Admin Portal</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-800 font-['Poppins'] min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
        <!-- Header banner -->
        <div class="bg-gradient-to-r from-red-700 to-rose-600 p-8 text-center text-white relative">
            <div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-3 border border-white/20 shadow-inner">
                <i class="fa-solid fa-user-shield text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Admin Portal</h1>
            <p class="text-xs text-rose-100 mt-1 font-medium">Life Line Blood Directory Management</p>
        </div>

        <!-- Form content -->
        <div class="p-8">
            {% if error %}
            <div class="mb-6 bg-red-50 border border-red-200 text-red-600 text-sm font-semibold p-3.5 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                {{ error }}
            </div>
            {% endif %}

            <form action="{% url 'admin_login' %}" method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <input type="text" name="username" placeholder="Enter admin username" required
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition pl-11">
                        <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <input type="password" name="password" placeholder="Enter admin password" required
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition pl-11">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 hover:to-rose-700 text-white font-bold rounded-xl shadow-lg shadow-red-500/30 transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket text-sm"></i>
                    Sign In to Dashboard
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'index' %}" class="text-xs text-slate-500 hover:text-slate-800 font-medium inline-flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-arrow-left"></i> Back to Public Directory
                </a>
            </div>
        </div>
    </div>

</body>
</html>
