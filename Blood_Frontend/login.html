
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life Line - Login</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main mobile-style container */
        .login-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: transparent;
            position: relative;
            padding: 35px 20px 25px;
            display: flex;
            flex-direction: column;
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #b91f2f;
            font-size: 29px;
            font-weight: 600;
        }

        .logo-icon {
            width: 48px;
            height: 58px;
            border: 4px solid #b91f2f;
            border-radius: 50% 50% 50% 10%;
            transform: rotate(45deg);
            position: relative;
        }

        .logo-icon::after {
            content: "+";
            position: absolute;
            color: #b91f2f;
            font-size: 25px;
            font-weight: 600;
            transform: rotate(-45deg);
            left: 11px;
            top: 12px;
        }

        /* Overlay Image */
        .overlay-image {
            display: none;
        }

        /* Login content */
        .login-content {
            width: 100%;
            margin-top: 80px;
            background: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), url('{% static "asset/OIP-removebg-preview.png" %}');
            background-size: cover;
            background-position: center;
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .welcome {
            text-align: center;
            margin-bottom: 65px;
        }

        .welcome h1 {
            color: #d82d40;
            font-size: 31px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #666666;
            font-size: 20px;
            font-weight: 400;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .input-box {
            width: 100%;
            height: 78px;
            border: 1px solid #d8d8d8;
            border-radius: 11px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            background: #fff;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 19px;
            color: #333;
            background: transparent;
        }

        .input-box input::placeholder {
            color: #777;
        }

        /* Hide default browser password eye icon (Edge) */
        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }

        .password-icon {
            color: #777;
            font-size: 20px;
            cursor: pointer;
        }

        /* Forgot password */
        .forgot {
            text-align: right;
            margin-top: 12px;
            margin-bottom: 40px;
        }

        .forgot a {
            color: #7a3fe4;
            text-decoration: none;
            font-size: 17px;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        /* Login button */
        .login-btn {
            width: 100%;
            height: 70px;
            border: none;
            border-radius: 9px;
            background: #ed2941;
            color: white;
            font-family: inherit;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #d92138;
        }

        /* OR divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 42px 0;
            color: #777;
            font-size: 20px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #dddddd;
            flex: 1;
        }

        /* Google button */
        .google-btn {
            width: 100%;
            height: 68px;
            border: 1px solid #d8d8d8;
            border-radius: 9px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            color: #666;
            font-family: inherit;
            font-size: 18px;
            cursor: pointer;
        }

        .google-btn img {
            width: 27px;
            height: 27px;
        }

        /* Sign up */
        .signup {
            text-align: center;
            margin-top: 65px;
            color: #666;
            font-size: 17px;
        }

        .signup a {
            color: #7a3fe4;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding-top: 80px;
            text-align: center;
        }

        .footer p {
            color: #777;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .company {
            color: #1683a5;
            font-size: 22px;
            font-weight: 500;
        }


        /* =========================================
           DESKTOP
        ========================================= */

        @media (min-width: 768px) {

            body {
                background: #ffffff;
                padding: 0;
            }

            .login-container {
                max-width: 100%;
                min-height: 100vh;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                box-shadow: none;

                display: flex;
                flex-direction: row;
                padding: 0;
                overflow: hidden;
            }

            /* Left branding section */
            .login-container::before {
                content: "";
                width: 42%;
                height: 100%;
                background: #ffffff;
                position: absolute;
                left: 0;
                top: 0;
            }

            .logo {
                position: absolute;
                left: 50px;
                top: 45px;
                z-index: 2;
                font-size: 30px;
            }

            .overlay-image {
                display: flex;
                position: absolute;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 42%;
                margin-top: 0;
                margin-left: 164px;
                justify-content: center;
            }

            .overlay-image img {
                width: 70%;
                max-width: 350px;
            }

            .login-content {
                position: absolute;
                width: 100%;
                max-width: 460px;
                right: 8%;
                top: 50%;
                transform: translateY(-50%);
                margin-top: 0;
                padding: 50px 40px;
                background: #ffffff;
            }

            .welcome {
                margin-bottom: 40px;
            }

            .welcome h1 {
                font-size: 32px;
            }

            .welcome p {
                font-size: 17px;
            }

            .input-box {
                height: 62px;
            }

            .input-box input {
                font-size: 16px;
            }

            .forgot {
                margin-bottom: 25px;
            }

            .forgot a {
                font-size: 15px;
            }

            .login-btn {
                height: 58px;
                font-size: 18px;
            }

            .divider {
                margin: 28px 0;
                font-size: 17px;
            }

            .google-btn {
                height: 58px;
                font-size: 16px;
            }

            .signup {
                margin-top: 35px;
                font-size: 15px;
            }

            .footer {
                position: absolute;
                bottom: 25px;
                right: 5%;
                width: 50%;
                padding: 0;
            }
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            .login-container {
                padding-left: 22px;
                padding-right: 22px;
            }

            .logo {
                font-size: 25px;
            }

            .logo-icon {
                width: 42px;
                height: 51px;
            }

            .login-content {
                margin-top: 170px;
            }

            .welcome {
                margin-bottom: 45px;
            }

            .welcome h1 {
                font-size: 27px;
            }

            .welcome p {
                font-size: 17px;
            }

            .input-box {
                height: 65px;
            }

            .login-btn {
                height: 62px;
            }

            .google-btn {
                height: 62px;
                font-size: 15px;
            }

            .signup {
                margin-top: 45px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- Logo -->
    <div class="logo flex items-center gap-2 sm:gap-2.5" style="display: flex; align-items: center; gap: 8px;">
        <span class="text-[#E02424] text-xl sm:text-2xl flex items-center" style="color: #E02424; font-size: 22px;">
          <i class="fa-solid fa-droplet"></i>
        </span>
        <span class="text-base sm:text-lg font-bold text-slate-900 tracking-tight" style="color: #b91f2f; font-weight: 700; font-size: 24px;">Life Line</span>
        <span class="hidden sm:inline text-base sm:text-lg font-bold text-slate-900 tracking-tight" style="color: #b91f2f; font-weight: 700; font-size: 24px;">: Blood Donor Directory</span>
    </div>
    <div class="overlay-image">
        <img src="{% static 'asset/OIP-removebg-preview.png' %}" alt="overlay">
    </div>


    <!-- Login Section -->
    <div class="login-content">

        <!-- Welcome -->
        <div class="welcome">
            <h1>Welcome Back!</h1>
            <p>Please sign in to your account</p>
        </div>


        <!-- Login Form -->
        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}

            {% if error %}
            <div style="color: #ed2941; text-align: center; margin-bottom: 15px; font-size: 14px; font-weight: 500;">
                {{ error }}
            </div>
            {% endif %}

            <!-- Phone Number -->
            <div class="form-group">
                <div class="input-box">
                    <input
                        type="text"
                        name="phone_number"
                        placeholder="Phone Number"
                        required
                    >
                </div>
            </div>


            <!-- Password -->
            <div class="form-group">
                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required
                    >

                    <i
                        class="fa-solid fa-eye password-icon"
                        id="togglePassword"
                    ></i>

                </div>
            </div>


            <!-- Forgot Password -->
            <div class="forgot">
                <a href="#">Forgot Password ?</a>
            </div>


            <!-- Login -->
            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <!-- Sign Up -->
        <div class="signup">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign up</a>
        </div>

    </div>

</div>


<script>

    // Password show/hide
    const togglePassword =
        document.getElementById("togglePassword");

    const password =
        document.getElementById("password");

    togglePassword.addEventListener("click", function () {

        if (password.type === "password") {

            password.type = "text";

            this.classList.remove("fa-eye");
            this.classList.add("fa-eye-slash");

        } else {

            password.type = "password";

            this.classList.remove("fa-eye-slash");
            this.classList.add("fa-eye");

        }

    });

</script>

</body>
</html>
