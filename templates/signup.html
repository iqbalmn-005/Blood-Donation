
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life Line - Sign Up</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .signup-container {

            width: 100%;
            max-width: 430px;

            min-height: 100vh;

            background: transparent;

            position: relative;

            padding: 35px 20px 25px;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            display: flex;
            align-items: center;

            gap: 10px;

            color: #b91f2f;

            font-size: 29px;

            font-weight: 600;
        }


        /* Blood drop style icon */

        .logo-icon {

            width: 48px;
            height: 58px;

            border: 4px solid #b91f2f;

            border-radius: 50% 50% 50% 10%;

            transform: rotate(45deg);

            position: relative;
        }


        .logo-icon::after {

            content: "+";

            position: absolute;

            color: #b91f2f;

            font-size: 25px;

            font-weight: 600;

            transform: rotate(-45deg);

            left: 11px;
            top: 12px;
        }


        /* Overlay Image */
        .overlay-image {
            display: none;
        }


        /* =========================
           SIGNUP CONTENT
        ========================= */

        .signup-content {

            width: 100%;

            margin-top: 80px;

            background: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), url('{% static "asset/OIP-removebg-preview.png" %}');
            background-size: cover;
            background-position: center;

            padding: 40px 25px;

            border-radius: 24px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {

            text-align: center;

            margin-bottom: 35px;
        }


        .welcome h1 {

            color: #d82d40;

            font-size: 30px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .welcome p {

            color: #666666;

            font-size: 17px;

            font-weight: 400;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 15px;
        }


        .input-box {

            width: 100%;

            height: 60px;

            border: 1px solid #d8d8d8;

            border-radius: 10px;

            display: flex;

            align-items: center;

            padding: 0 18px;

            background: #ffffff;
        }


        .input-box:focus-within {

            border-color: #ed2941;
        }


        .input-box input {

            width: 100%;
            height: 100%;

            border: none;
            outline: none;

            font-family: inherit;

            font-size: 16px;

            color: #333;

            background: transparent;
        }


        .input-box input::placeholder {

            color: #777;
        }


        /* Hide default browser password eye icon (Edge) */
        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }


        /* =========================
           SELECT
        ========================= */

        .input-box select {

            width: 100%;
            height: 100%;

            border: none;
            outline: none;

            font-family: inherit;

            font-size: 16px;

            color: #777;

            background: transparent;

            cursor: pointer;
        }


        /* =========================
           PASSWORD ICON
        ========================= */

        .password-icon {

            color: #777;

            font-size: 18px;

            cursor: pointer;

            margin-left: 10px;
        }


        /* =========================
           SIGNUP BUTTON
        ========================= */

        .signup-btn {

            width: 100%;

            height: 62px;

            border: none;

            border-radius: 9px;

            background: #ed2941;

            color: white;

            font-family: inherit;

            font-size: 19px;

            cursor: pointer;

            margin-top: 10px;

            transition: 0.2s;
        }


        .signup-btn:hover {

            background: #d92138;
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {

            text-align: center;

            margin-top: 35px;

            color: #666;

            font-size: 16px;
        }


        .login-link a {

            color: #7a3fe4;

            text-decoration: none;
        }


        .login-link a:hover {

            text-decoration: underline;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            margin-top: auto;

            padding-top: 50px;

            text-align: center;
        }


        .footer p {

            color: #777;

            font-size: 14px;

            margin-bottom: 5px;
        }


        .company {

            color: #1683a5;

            font-size: 22px;

            font-weight: 500;
        }



        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 768px) {

            body {

                background: #ffffff;

                padding: 0;
            }


            .signup-container {

                max-width: 100%;

                min-height: 100vh;

                height: 100vh;

                max-height: 100vh;

                border-radius: 0;

                box-shadow: none;

                display: flex;
                flex-direction: row;

                overflow: hidden;

                padding: 0;
            }


            /* Left section */

            .signup-container::before {

                content: "";

                width: 42%;

                height: 100%;

                background: #ffffff;

                position: absolute;

                left: 0;

                top: 0;
            }


            /* Logo */

            .logo {

                position: absolute;

                left: 50px;

                top: 45px;

                z-index: 2;

                font-size: 30px;
            }


            /* Content */

            .signup-content {

                position: absolute;

                width: 100%;

                max-width: 460px;

                right: 8%;

                top: 50%;

                transform: translateY(-50%);

                margin-top: 0;

                padding: 50px 40px;

                background: #ffffff;
            }


            .welcome {

                margin-bottom: 25px;
            }


            .welcome h1 {

                font-size: 30px;
            }


            .welcome p {

                font-size: 16px;
            }


            .form-group {

                margin-bottom: 12px;
            }


            .input-box {

                height: 52px;
            }


            .input-box input,
            .input-box select {

                font-size: 15px;
            }


            .signup-btn {

                height: 55px;

                font-size: 17px;

                margin-top: 8px;
            }


            .login-link {

                margin-top: 25px;

                font-size: 15px;
            }
            .overlay-image {
                display: flex;
                position: absolute;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 42%;
                margin-top: 0;
                margin-left: 164px;
                justify-content: center;
            }

            .overlay-image img {
                width: 70%;
                max-width: 350px;
            }


            .footer {

                position: absolute;

                bottom: 25px;

                right: 5%;

                width: 50%;

                padding: 0;
            }
        }



        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 380px) {

            .signup-container {

                padding-left: 22px;

                padding-right: 22px;
            }


            .logo {

                font-size: 25px;
            }


            .logo-icon {

                width: 42px;

                height: 51px;
            }


            .signup-content {

                margin-top: 80px;
            }


            .welcome {

                margin-bottom: 28px;
            }


            .welcome h1 {

                font-size: 26px;
            }


            .welcome p {

                font-size: 15px;
            }


            .input-box {

                height: 55px;
            }


            .signup-btn {

                height: 58px;
            }


            .login-link {

                margin-top: 28px;
            }
        }

    </style>
</head>


<body>


<!-- =========================================
     SIGNUP CONTAINER
========================================= -->

<div class="signup-container">


    <!-- LOGO -->

    <div class="logo flex items-center gap-2 sm:gap-2.5" style="display: flex; align-items: center; gap: 8px;">
        <span class="text-[#E02424] text-xl sm:text-2xl flex items-center" style="color: #E02424; font-size: 22px;">
          <i class="fa-solid fa-droplet"></i>
        </span>
        <span class="text-base sm:text-lg font-bold text-slate-900 tracking-tight" style="color: #b91f2f; font-weight: 700; font-size: 24px;">Life Line</span>
        <span class="hidden sm:inline text-base sm:text-lg font-bold text-slate-900 tracking-tight" style="color: #b91f2f; font-weight: 700; font-size: 24px;">: Blood Donor Directory</span>
    </div>

    <div class="overlay-image">
        <img src="{% static 'asset/OIP-removebg-preview.png' %}" alt="overlay">
    </div>




    <!-- =====================================
         SIGNUP CONTENT
    ====================================== -->

    <div class="signup-content">


        <!-- TITLE -->

        <div class="welcome">

            <h1>Create Account</h1>

            <p>Register as a blood donor</p>

        </div>

        {% if error %}
        <div style="background-color: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; margin-bottom: 20px; text-align: center;">
            <i class="fa-solid fa-circle-exclamation" style="margin-right: 6px;"></i> {{ error }}
        </div>
        {% endif %}

        <!-- =================================
             FORM
        ================================== -->

        <form id="signupForm" action="{% url 'signup' %}" method="POST">
            {% csrf_token %}

            <!-- FULL NAME -->

            <div class="form-group">

                <div class="input-box">

                    <input
                        type="text"
                        name="first_name"
                        placeholder="Full Name"
                        required>

                </div>

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <div class="input-box">

                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required>

                </div>

            </div>



            <!-- PHONE -->

            <div class="form-group">

                <div class="input-box">

                    <input
                        type="tel"
                        name="phone_number"
                        placeholder="Phone Number"
                        maxlength="10"
                        required>

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required>

                    <i
                        class="fa-solid fa-eye password-icon"
                        id="togglePassword">
                    </i>

                </div>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <div class="input-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Confirm Password"
                        required>

                    <i
                        class="fa-solid fa-eye password-icon"
                        id="toggleConfirmPassword">
                    </i>

                </div>

            </div>



            <!-- BLOOD GROUP -->

            <div class="form-group">

                <div class="input-box">

                    <select
                        name="blood_group"
                        required>

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>

                        <option value="A-">A-</option>

                        <option value="B+">B+</option>

                        <option value="B-">B-</option>

                        <option value="AB+">AB+</option>

                        <option value="AB-">AB-</option>

                        <option value="O+">O+</option>

                        <option value="O-">O-</option>

                    </select>

                </div>

            </div>



            <!-- DISTRICT -->

            <div class="form-group">

                <div class="input-box">

                    <select
                        name="district"
                        required>

                        <option value="">
                            Select District
                        </option>

                        <option value="Kasaragod">Kasaragod</option>
                        <option value="Kannur">Kannur</option>
                        <option value="Wayanad">Wayanad</option>
                        <option value="Kozhikode">Kozhikode</option>
                        <option value="Malappuram">Malappuram</option>
                        <option value="Palakkad">Palakkad</option>
                        <option value="Thrissur">Thrissur</option>
                        <option value="Ernakulam">Ernakulam</option>
                        <option value="Idukki">Idukki</option>
                        <option value="Kottayam">Kottayam</option>
                        <option value="Alappuzha">Alappuzha</option>
                        <option value="Pathanamthitta">Pathanamthitta</option>
                        <option value="Kollam">Kollam</option>
                        <option value="Thiruvananthapuram">Thiruvananthapuram</option>

                    </select>

                </div>

            </div>



            <!-- CREATE ACCOUNT BUTTON -->

            <button
                type="submit"
                class="signup-btn">

                Create Account

            </button>


        </form>



        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>


    </div>
</div>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>

    /* ================================
       PASSWORD SHOW / HIDE
    ================================= */

    const password =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");


    togglePassword.addEventListener("click", function () {

        if (password.type === "password") {

            password.type = "text";

            this.classList.remove("fa-eye");

            this.classList.add("fa-eye-slash");

        }

        else {

            password.type = "password";

            this.classList.remove("fa-eye-slash");

            this.classList.add("fa-eye");

        }

    });



    /* ================================
       CONFIRM PASSWORD SHOW / HIDE
    ================================= */

    const confirmPassword =
        document.getElementById("confirmPassword");

    const toggleConfirmPassword =
        document.getElementById("toggleConfirmPassword");


    toggleConfirmPassword.addEventListener("click", function () {

        if (confirmPassword.type === "password") {

            confirmPassword.type = "text";

            this.classList.remove("fa-eye");

            this.classList.add("fa-eye-slash");

        }

        else {

            confirmPassword.type = "password";

            this.classList.remove("fa-eye-slash");

            this.classList.add("fa-eye");

        }

    });



    /* ================================
       PASSWORD MATCH CHECK
    ================================= */

    const signupForm =
        document.getElementById("signupForm");


    signupForm.addEventListener("submit", function(event) {

        if (password.value !== confirmPassword.value) {

            event.preventDefault();

            alert("Passwords do not match!");

        }

    });

</script>


</body>
</html>
